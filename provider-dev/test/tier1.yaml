# Tier 1 smoke tests: read-only SELECT queries that any reasonable user
# would expect to "just work" against a freshly-built provider.
#
# Each entry has:
#   name           - test id (used in pytest output)
#   sql            - SQL to execute. ${VAR} is substituted from env / defaults.
#   assertions:
#     min_rows         - result set must have at least this many rows (default 1)
#     required_columns - every named column must be present on every row
#     row_predicates   - list of Python expressions evaluated with `rows` and `r`
#                        (r = rows[0]) in scope. Allowed builtins: all, any, len,
#                        int, float, str, bool, isinstance, abs, min, max, sum,
#                        range, sorted, set, list, dict, tuple. All must be truthy.
#   xfail (optional)   - flag known provider/binary bugs without losing visibility:
#     reason: "..."        (required; printed in pytest output)
#     modes: [pgwire]      (optional; if omitted, xfails in all modes)
#
# Keep this list small (~15 queries). The goal is "is the provider broken?",
# not exhaustive coverage.

- name: list_org_repos
  sql: |
    SELECT name, private, default_branch, visibility
    FROM github.repos.repos
    WHERE org = '${TEST_ORG}'
  assertions:
    min_rows: 1
    required_columns: [name, private, default_branch, visibility]
    row_predicates:
      - "all(row['name'] for row in rows)"

- name: get_single_repo
  sql: |
    SELECT name, full_name, default_branch
    FROM github.repos.details
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [name, full_name, default_branch]
    row_predicates:
      - "r['name'] == '${TEST_REPO}'"

- name: authenticated_user
  sql: SELECT login, id, type FROM github.users.users
  assertions:
    min_rows: 1
    required_columns: [login, id, type]
    row_predicates:
      - "isinstance(r['login'], str) and len(r['login']) > 0"

- name: lookup_user_by_username
  sql: |
    SELECT login, id, type
    FROM github.users.users
    WHERE username = '${TEST_USER}'
  assertions:
    min_rows: 1
    row_predicates:
      - "r['login'] == '${TEST_USER}'"
  xfail:
    modes: [pgwire]
    reason: >-
      stackql pgwire path tries to materialise the result into a cache table
      that lacks the request-parameter column 'username' (works in exec mode).
      Upstream stackql binary bug - track and remove this xfail once fixed.

- name: org_detail
  sql: |
    SELECT login, id, type
    FROM github.orgs.orgs
    WHERE org = '${TEST_ORG}'
  assertions:
    min_rows: 1
    row_predicates:
      - "r['login'] == '${TEST_ORG}'"

- name: list_repo_issues
  sql: |
    SELECT number, title, state
    FROM github.issues.issues
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 0   # repo may legitimately have zero open issues
    required_columns: [number, title, state]

- name: list_pull_requests
  sql: |
    SELECT number, title, state
    FROM github.pulls.pull_requests
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}' AND state = 'closed'
  assertions:
    min_rows: 1
    required_columns: [number, title, state]

- name: list_workflows
  # GitHub returns {total_count, workflows: [...]}; the provider unwraps the
  # `workflows` array (objectKey) so each workflow is a row.
  sql: |
    SELECT id, name, state, path
    FROM github.actions.workflows
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [id, name, state, path]
    row_predicates:
      - "all(row['path'] for row in rows)"

- name: list_branches
  sql: |
    SELECT name, protected
    FROM github.repos.branches
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [name, protected]

- name: list_commits
  sql: |
    SELECT sha
    FROM github.repos.commits
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [sha]
    row_predicates:
      - "all(len(row['sha']) == 40 for row in rows)"

- name: rate_limit
  sql: |
    SELECT JSON_EXTRACT(rate, '$.limit') AS rate_limit,
           JSON_EXTRACT(rate, '$.remaining') AS remaining
    FROM github.rate_limit.rate_limit
  assertions:
    min_rows: 1
    required_columns: [rate_limit, remaining]

- name: search_repos
  # GitHub returns {total_count, incomplete_results, items:[...]}. stackql
  # appears to auto-unwrap `items` here, so we query item-level fields
  # (id/name/full_name) rather than the envelope.
  sql: |
    SELECT id, name, full_name
    FROM github.search.repos
    WHERE q = 'stackql in:name'
  assertions:
    min_rows: 1
    required_columns: [id, name, full_name]
    row_predicates:
      - "all(row['name'] for row in rows)"

# --- pagination -------------------------------------------------------------

- name: pagination_follows_link_header
  # The service-level x-stackQL-config declares Link-header pagination. The
  # default page size is 30, so more than 30 rows proves a second page was
  # fetched. TEST_REPO must have more than 30 commits.
  sql: |
    SELECT sha
    FROM github.repos.commits
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 31
    required_columns: [sha]

- name: pagination_honours_per_page_param
  # per_page is an ordinary operation parameter, pushed to the query string.
  sql: |
    SELECT count(*) AS n
    FROM github.repos.commits
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}' AND per_page = 100
  assertions:
    min_rows: 1
    row_predicates:
      - "int(r['n']) > 100"

# --- resources added in the 2026-08 spec refresh ------------------------------

- name: list_issue_types
  sql: |
    SELECT id, name
    FROM github.repos.issue_types
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 0   # only populated for repos in orgs with issue types configured

- name: list_contributors_window_function
  sql: |
    SELECT login, contributions,
           RANK() OVER (ORDER BY contributions DESC) AS rank
    FROM github.repos.contributors
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [login, contributions, rank]
    row_predicates:
      - "int(rows[0]['rank']) == 1"

# --- GraphQL-backed resources ---------------------------------------------------
# These POST to https://api.github.com/graphql; the same basic-auth PAT is used.

- name: graphql_discussions
  sql: |
    SELECT number, title, json_extract(category, '$.name') AS category, created_at
    FROM github.discussions.discussions
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1   # TEST_REPO must have Discussions enabled with at least one discussion
    required_columns: [number, title, category, created_at]
    row_predicates:
      - "all(int(row['number']) > 0 for row in rows)"

- name: graphql_discussion_categories
  sql: |
    SELECT name, slug, is_answerable
    FROM github.discussions.discussion_categories
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [name, slug, is_answerable]

- name: graphql_contribution_calendar
  sql: |
    SELECT first_day, contribution_days
    FROM github.users.contribution_calendar
    WHERE username = '${TEST_CALENDAR_USER}'
  assertions:
    min_rows: 52   # trailing year, one row per week
    required_columns: [first_day, contribution_days]

- name: graphql_contribution_calendar_json_each
  sql: |
    SELECT json_extract(d.value, '$.date') AS day,
           json_extract(d.value, '$.contribution_count') AS n
    FROM github.users.contribution_calendar c, json_each(c.contribution_days) d
    WHERE c.username = '${TEST_CALENDAR_USER}'
  assertions:
    min_rows: 365
    required_columns: [day, n]

- name: graphql_review_threads
  sql: |
    SELECT is_resolved, path, line
    FROM github.pulls.review_threads
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}' AND pull_number = ${TEST_PULL_NUMBER}
  assertions:
    min_rows: 0   # exercises the query path; the PR may have no review threads

- name: graphql_org_sponsorships
  sql: |
    SELECT id, privacy_level
    FROM github.orgs.sponsorships
    WHERE org = '${TEST_ORG}'
  assertions:
    min_rows: 0

- name: graphql_star_history
  sql: |
    SELECT starred_at, json_extract(user, '$.login') AS login
    FROM github.activity.star_history
    WHERE owner = '${TEST_ORG}' AND repo = '${TEST_REPO}'
  assertions:
    min_rows: 1
    required_columns: [starred_at, login]
  xfail:
    reason: >-
      Since July 2026 GitHub limits stargazer listings (REST and GraphQL) to
      repository admins and collaborators; other tokens get "Resource not
      accessible by personal access token". Remove this xfail when running
      with a token that has admin or collaborator access to TEST_REPO.
